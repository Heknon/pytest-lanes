[project]
name = "pytest-lanes"
version = "0.0.1"
description = "Run pytest-xdist schedulers on thread lanes: in one process, or many processes x many lanes"
requires-python = ">=3.9"   # tested: 3.12, 3.13, 3.14, 3.14t
dependencies = [
    "pytest>=8.0,<10",       # tested: 8.0.2, 8.3.5, 9.1.1. Raise the cap only after tests/ passes.
    "pytest-xdist>=3.6,<4",  # tested: 3.6.1, 3.8.0
]

[project.optional-dependencies]
test = ["pytest-reportlog", "pytest-rerunfailures", "pytest-html", "pytest-timeout", "pytest-mock", "pytest-cov"]

[project.entry-points.pytest11]
lanes = "pytest_lanes.plugin"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
