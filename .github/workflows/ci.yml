# Manual only: GitHub runners are paid. The local gate is scripts/matrix.sh, which this
# mirrors; dispatch this workflow deliberately (backlog item 9 covers adding triggers).
name: contract
on:
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.14t"]
        deps:
          - "pytest==8.0.2 pytest-xdist==3.6.1 pytest-rerunfailures==14.0"
          - "pytest==8.3.5 pytest-xdist==3.6.1 pytest-rerunfailures==14.0"
          - "pytest==9.1.1 pytest-xdist==3.8.0 pytest-rerunfailures"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install ${{ matrix.deps }} -e ".[test]"
      - run: python -m pytest tests -q -p no:cacheprovider -p no:warnings -n 4
  upstream-main:
    # Early warning when pytest/xdist main change a private touchpoint (P1-P15, X1-X4):
    # the startup probes then refuse to run and name it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install git+https://github.com/pytest-dev/pytest git+https://github.com/pytest-dev/pytest-xdist -e ".[test]"
      - run: python -m pytest tests -q -p no:cacheprovider -p no:warnings -n 4
