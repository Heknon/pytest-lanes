# Release on merge: a push to master whose pyproject.toml version has no vX.Y.Z tag yet
# builds, tests (one combo; the full local scripts/matrix.sh is the real gate), publishes
# to PyPI (Trusted Publishing: no token stored here), then tags that commit vX.Y.Z and
# makes the GitHub Release. A push without a version bump stops after the first job.
# A manual run (workflow_dispatch) builds and tests only: it never publishes or tags.
name: release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}          # the tags
      - id: v
        name: New version? (no vX.Y.Z tag for pyproject.toml's version yet)
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"   # manual run: a dry run
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Release notes from CHANGELOG.md, checked before anything publishes
        env: {VERSION: "${{ needs.version.outputs.version }}"}
        run: |
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel installs and the plugin loads
        run: |
          python -m venv /tmp/check && /tmp/check/bin/pip install dist/*.whl
          cd /tmp && /tmp/check/bin/python -m pytest --help | grep -- "--lanes=N"
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/upload-artifact@v4
        with: {name: notes, path: notes.md}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      # The built wheel, not the checkout, is what gets tested.
      - run: pip install "pytest==9.1.1" "pytest-xdist==3.8.0" "$(ls dist/*.whl)[test]"
      - run: python -m pytest tests -q -p no:cacheprovider -p no:warnings -n 4

  publish:
    needs: [version, test]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/project/pytest-threadlanes/"}
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # creates the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/download-artifact@v4
        with: {name: notes, path: .}
      - name: Tag this commit vX.Y.Z and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
