# Release: push a tag vX.Y.Z matching pyproject.toml's version (README → Releasing).
# build -> test (one combo; the full local scripts/matrix.sh is the real gate) ->
# publish to PyPI (Trusted Publishing: no token stored here) -> GitHub Release.
# A manual run (workflow_dispatch) builds and tests only: it never publishes.
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"; exit 1
          fi
      - name: Release notes from CHANGELOG.md, checked before anything publishes
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          awk -v v="## $version" '$0==v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel installs and the plugin loads
        run: |
          python -m venv /tmp/check && /tmp/check/bin/pip install dist/*.whl
          cd /tmp && /tmp/check/bin/python -m pytest --help | grep -- "--lanes=N"
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/upload-artifact@v4
        with: {name: notes, path: notes.md}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      # The built wheel, not the checkout, is what gets tested.
      - run: pip install "pytest==9.1.1" "pytest-xdist==3.8.0" "$(ls dist/*.whl)[test]"
      - run: python -m pytest tests -q -p no:cacheprovider -p no:warnings -n 4

  publish:
    needs: test
    # A tag push only: a manual run started on a tag ref must not publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/project/pytest-threadlanes/"}
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/download-artifact@v4
        with: {name: notes, path: .}
      - name: GitHub Release with this version's CHANGELOG section
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
